name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RELEASEBOX_REF: v0.1.0

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Install dependencies
        run: npm ci
      - name: Install ReleaseBox
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$RELEASEBOX_REF" https://github.com/rogerchappel/releasebox.git /tmp/releasebox
          npm --prefix /tmp/releasebox ci
          npm --prefix /tmp/releasebox run build
      - name: ReleaseBox readiness check
        run: node /tmp/releasebox/bin/releasebox.js check .
      - name: Run release checks
        run: npm run release:check
      - name: Build package
        id: package
        run: |
          set -euo pipefail
          npm pack --json > npm-pack.json
          node --input-type=module -e "import fs from 'node:fs'; const [{filename}] = JSON.parse(fs.readFileSync('npm-pack.json', 'utf8')); fs.appendFileSync(process.env.GITHUB_OUTPUT, `tarball=${filename}\n`);"
      - name: Smoke test packaged CLI
        env:
          TARBALL: ${{ steps.package.outputs.tarball }}
        run: |
          set -euo pipefail
          smoke_dir="$(mktemp -d)"
          npm install --prefix "$smoke_dir" "$GITHUB_WORKSPACE/$TARBALL"
          "$smoke_dir/node_modules/.bin/skilldrift" --version
          "$smoke_dir/node_modules/.bin/skilldrift" --help
      - name: Publish package to npm
        env:
          TARBALL: ${{ steps.package.outputs.tarball }}
        run: npm publish "$TARBALL" --provenance --access public
      - name: Generate release notes
        run: node /tmp/releasebox/bin/releasebox.js notes . > RELEASE_NOTES.md
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TARBALL: ${{ steps.package.outputs.tarball }}
        run: gh release create "${GITHUB_REF_NAME}" --notes-file RELEASE_NOTES.md "$TARBALL"
